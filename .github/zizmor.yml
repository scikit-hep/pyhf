rules:
  unpinned-uses:
    # c.f. https://docs.zizmor.sh/audits/#unpinned-uses-configuration
    config:
      policies:
        "*": ref-pin

  concurrency-limits:
    ignore:
      - copilot-setup-steps.yml

  artipacked:
    # The release workflows push a branch or tag with the credentials that
    # actions/checkout persists, so credential persistence is required
    ignore:
      - release-prepare.yml
      - release-tag.yml
