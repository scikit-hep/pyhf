name: CI on Windows

on:
  # Run daily at 1:23 UTC
  schedule:
  - cron:  '23 1 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test on Windows

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install uv
        uv pip install --system --upgrade ".[all]" --group test

    # c.f. https://github.com/scikit-hep/pyhf/issues/2653
    - name: Guard against Python 3.9 pyparsing
      if: matrix.python-version == '3.9'
      run: uv pip install --system "pyparsing<3.3.0"

    - name: List installed Python packages
      run: python -m pip list

    - name: Test with pytest and coverage
      # FIXME: ignore tests/test_scripts.py as runner breaks on Windows currently
      run: |
        coverage run --module pytest --ignore tests/test_scripts.py --ignore tests/contrib --ignore tests/benchmarks --ignore tests/test_notebooks.py

    - name: Coverage report for core project
      run: |
        coverage report
        coverage xml
