name: Prepare release

on:
  workflow_dispatch:
    inputs:
      new_version:
        description: 'Version of the release (e.g. 1.2.3 or 1.2.3rc1, no leading v)'
        required: true
        type: string

concurrency:
  # Serialize runs preparing the same release version, as concurrent runs
  # (e.g. dispatched on different branches) force push the same
  # bump-version/vX.Y.Z branch
  group: ${{ github.workflow }}-${{ inputs.new_version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Open release preparation pull request
    runs-on: ubuntu-latest
    if: github.repository == 'scikit-hep/pyhf'

    steps:
    - name: Check branch is intended for release
      run: |
        if [[ "${GITHUB_REF}" != "refs/heads/main" && "${GITHUB_REF}" != refs/heads/release/v* ]]; then
            echo "ERROR: ${GITHUB_REF} is not intended for release." >&2
            echo "       Releases are made only from 'main' or 'release/vX.Y.x' branches." >&2
            exit 1
        fi

    # The workflow dispatch ref selects the branch to release from.
    # Use GitHub PAT to authenticate so CI triggers on the pull request.
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        token: ${{ secrets.ACCESS_TOKEN }}
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

    # The review of the release preparation pull request validates the
    # release version
    - name: Validate version
      env:
        VERSION: ${{ inputs.new_version }}
      run: |
        uv run --no-project .github/workflows/validate-version.py "${VERSION}"

        # Catch versions already released from another release series branch
        # (fetch-depth: 0 fetches all tags, including release branch tags)
        if git rev-parse --quiet --verify "refs/tags/v${VERSION}" > /dev/null; then
            echo "ERROR: tag v${VERSION} already exists." >&2
            exit 1
        fi

        echo "## Bumping version to ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

    - name: Bump version in files
      env:
        VERSION: ${{ inputs.new_version }}
      run: uvx tbump --non-interactive --only-patch "${VERSION}"

    - name: Open release preparation pull request
      env:
        GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        VERSION: ${{ inputs.new_version }}
        BASE_BRANCH: ${{ github.ref_name }}
      run: |
        branch="bump-version/v${VERSION}"

        git config --local user.name "github-actions[bot]"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git switch --create "${branch}"
        git commit --all --message "chore: Bump version to v${VERSION}"
        # The release preparation branch is owned by this workflow, so
        # replace any leftover branch from a closed release preparation
        # pull request for the same version
        git push --force --set-upstream origin "${branch}"

        cat > "${RUNNER_TEMP}/pull_request_body.md" <<EOF
        Bump version from the latest release to v${VERSION} in all files managed by tbump.toml.

        Reviewing this pull request is the release "dry run":
        * [ ] Verify the new version is the intended release version.
        * [ ] Verify there is a release notes file for the release under docs/release-notes.
        * [ ] After merging, run the [Tag release workflow](https://github.com/scikit-hep/pyhf/actions/workflows/release-tag.yml) on the ${BASE_BRANCH} branch to create the release tag.
        EOF

        # A rerun's force push has already updated any open release
        # preparation pull request for this version, so only create one
        # if none exists
        if [ "$(gh pr list --head "${branch}" --state open --json number --jq 'length')" -eq 0 ]; then
            gh pr create \
                --base "${BASE_BRANCH}" \
                --head "${branch}" \
                --title "chore: Bump version to v${VERSION}" \
                --body-file "${RUNNER_TEMP}/pull_request_body.md"
        else
            echo "The open release preparation pull request for ${branch} was updated by the force push."
        fi
