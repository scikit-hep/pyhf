name: Prepare release

on:
  workflow_dispatch:
    inputs:
      new_version:
        description: 'Version of the release (e.g. 0.8.0 or 0.8.0rc1, no leading v)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Open release preparation pull request
    runs-on: ubuntu-latest
    if: github.repository == 'scikit-hep/pyhf'

    steps:
    # The workflow dispatch ref selects the branch to release from.
    # Use GitHub PAT to authenticate so CI triggers on the pull request.
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        token: ${{ secrets.ACCESS_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install Python dependencies
      run: |
        python -m pip install uv
        uv pip install --system packaging tbump
        python -m pip list

    # tbump validates the version format against its regex, and the review of
    # the release preparation pull request validates the release version
    - name: Validate version is newer than the current version
      env:
        VERSION: ${{ inputs.new_version }}
      run: |
        python - <<'EOF'
        import os
        import tomllib
        from pathlib import Path

        from packaging.version import Version

        new_version = os.environ["VERSION"]
        with Path("tbump.toml").open("rb") as manifest:
            current_version = tomllib.load(manifest)["version"]["current"]
        if Version(new_version) <= Version(current_version):
            error_message = (
                f"ERROR: {new_version} is not newer than the current version"
                f" {current_version}."
                " Is this the correct branch for this release?"
            )
            raise SystemExit(error_message)
        print(f"Bumping version: {current_version} -> {new_version}")
        EOF
        echo "## Bumping version to ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

    - name: Bump version in files
      env:
        VERSION: ${{ inputs.new_version }}
      run: tbump --non-interactive --only-patch "${VERSION}"

    - name: Open release preparation pull request
      env:
        GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        VERSION: ${{ inputs.new_version }}
        BASE_BRANCH: ${{ github.ref_name }}
      run: |
        branch="bump-version/v${VERSION}"

        git config --local user.name "github-actions[bot]"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git switch --create "${branch}"
        git commit --all --message "chore: Bump version to v${VERSION}"
        git push --set-upstream origin "${branch}"

        cat > "${RUNNER_TEMP}/pull_request_body.md" <<EOF
        Bump version from the latest release to v${VERSION} in all files managed by tbump.toml.

        Reviewing this pull request is the release "dry run":
        * [ ] Verify the new version is the intended release version.
        * [ ] Verify there is a release notes file for the release under docs/release-notes.
        * [ ] After merging, run the [Tag release workflow](https://github.com/scikit-hep/pyhf/actions/workflows/release-tag.yml) on this branch to create the release tag.
        EOF

        gh pr create \
            --base "${BASE_BRANCH}" \
            --head "${branch}" \
            --title "chore: Bump version to v${VERSION}" \
            --body-file "${RUNNER_TEMP}/pull_request_body.md"
