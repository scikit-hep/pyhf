name: Prepare release

on:
  workflow_dispatch:
    inputs:
      new_version:
        description: 'Version of the release (e.g. 0.8.0 or 0.8.0rc1, no leading v)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Open release preparation pull request
    runs-on: ubuntu-latest
    if: github.repository == 'scikit-hep/pyhf'

    steps:
    # The workflow dispatch ref selects the branch to release from.
    # Use GitHub PAT to authenticate so CI triggers on the pull request.
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        token: ${{ secrets.ACCESS_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install Python dependencies
      run: |
        python -m pip install uv
        uv pip install --system packaging tbump
        python -m pip list

    # The review of the release preparation pull request validates the
    # release version
    - name: Validate version
      env:
        VERSION: ${{ inputs.new_version }}
      run: |
        python .github/workflows/validate-version.py "${VERSION}"

        # Catch versions already released from another release series branch
        # (fetch-depth: 0 fetches all tags, including release branch tags)
        if git rev-parse --quiet --verify "refs/tags/v${VERSION}" > /dev/null; then
            echo "ERROR: tag v${VERSION} already exists." >&2
            exit 1
        fi

        echo "## Bumping version to ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

    - name: Bump version in files
      env:
        VERSION: ${{ inputs.new_version }}
      run: tbump --non-interactive --only-patch "${VERSION}"

    - name: Open release preparation pull request
      env:
        GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        VERSION: ${{ inputs.new_version }}
        BASE_BRANCH: ${{ github.ref_name }}
      run: |
        branch="bump-version/v${VERSION}"

        git config --local user.name "github-actions[bot]"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git switch --create "${branch}"
        git commit --all --message "chore: Bump version to v${VERSION}"
        # The release preparation branch is owned by this workflow, so
        # replace any leftover branch from a closed release preparation
        # pull request for the same version
        git push --force --set-upstream origin "${branch}"

        cat > "${RUNNER_TEMP}/pull_request_body.md" <<EOF
        Bump version from the latest release to v${VERSION} in all files managed by tbump.toml.

        Reviewing this pull request is the release "dry run":
        * [ ] Verify the new version is the intended release version.
        * [ ] Verify there is a release notes file for the release under docs/release-notes.
        * [ ] After merging, run the [Tag release workflow](https://github.com/scikit-hep/pyhf/actions/workflows/release-tag.yml) on the ${BASE_BRANCH} branch to create the release tag.
        EOF

        gh pr create \
            --base "${BASE_BRANCH}" \
            --head "${branch}" \
            --title "chore: Bump version to v${VERSION}" \
            --body-file "${RUNNER_TEMP}/pull_request_body.md"
