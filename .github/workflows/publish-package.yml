name: publish distributions
on:
  push:
    branches:
    - main
    tags:
    - v*
  pull_request:
    branches:
    - main
    - release/v*
  release:
    types: [published]
  # Run weekly at 1:23 UTC
  schedule:
  - cron:  '23 1 * * 0'
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        description: 'Publish to TestPyPI'
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Python distribution
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    outputs:
      publish-target: ${{ steps.gate.outputs.target }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false

    # The single definition of when the built distribution gets published:
    # a Git tag push deploys to TestPyPI for verification in advance of the
    # release, a GitHub release publication deploys to PyPI, and a manual
    # workflow dispatch can deploy a dev release snapshot to TestPyPI
    - name: Determine publish target
      id: gate
      if: github.repository == 'scikit-hep/pyhf'
      env:
        PUBLISH_INPUT: ${{ inputs.publish }}
      run: |
        target=""
        if [ "${GITHUB_EVENT_NAME}" == "release" ]; then
            target="pypi"
        elif [ "${GITHUB_EVENT_NAME}" == "push" ] && [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            target="testpypi"
        elif [ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ] && [ "${PUBLISH_INPUT}" == "true" ]; then
            target="testpypi"
        fi
        echo "target=${target}" >> "$GITHUB_OUTPUT"

    - name: Build a sdist and wheel
      id: baipp
      uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1
      env:
        # Weekly check that builds are warning free
        PYTHONWARNINGS: ${{ github.event_name == 'schedule' && 'error,default::DeprecationWarning' || '' }}

    - name: Verify untagged commits have dev versions
      if: "!startsWith(github.ref, 'refs/tags/')"
      env:
        DIST_PATH: ${{ steps.baipp.outputs.dist }}
      run: |
        latest_tag=$(git describe --tags)
        latest_tag_revlist_SHA=$(git rev-list -n 1 "${latest_tag}")
        main_SHA="$(git rev-parse --verify origin/main)"
        wheel_name=$(find "${DIST_PATH}" -iname "*.whl" -printf "%f\n")
        if [[ "${latest_tag_revlist_SHA}" != "${main_SHA}" ]]; then # don't check main push events coming from tags
          if [[ "${wheel_name}" == *"pyhf-0.1.dev"* || "${wheel_name}" != *"dev"* ]]; then
            echo "python-build incorrectly named built distribution: ${wheel_name}"
            echo "python-build is lacking the history and tags required to determine version number"
            echo "intentionally erroring with 'exit 1' now"
            exit 1
          fi
        else
          echo "Push event to origin/main was triggered by push of tag ${latest_tag}"
        fi
        echo "python-build named built distribution: ${wheel_name}"

    - name: Verify tagged commits don't have dev versions
      if: startsWith(github.ref, 'refs/tags')
      env:
        DIST_PATH: ${{ steps.baipp.outputs.dist }}
      run: |
        wheel_name=$(find "${DIST_PATH}" -iname "*.whl" -printf "%f\n")
        if [[ "${wheel_name}" == *"dev"* ]]; then
          echo "python-build incorrectly named built distribution: ${wheel_name}"
          echo "this is incorrrectly being treated as a dev release"
          echo "intentionally erroring with 'exit 1' now"
          exit 1
        fi
        echo "python-build named built distribution: ${wheel_name}"

    - name: Generate artifact attestation for sdist and wheel
      if: steps.gate.outputs.target != ''
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: "${{ steps.baipp.outputs.dist }}/pyhf-*"

  publish-testpypi:
    name: Publish Python distribution to TestPyPI
    needs: build
    if: needs.build.outputs.publish-target == 'testpypi'
    runs-on: ubuntu-latest
    # Mandatory for publishing with a trusted publisher
    # c.f. https://docs.pypi.org/trusted-publishers/using-a-publisher/
    permissions:
      id-token: write
    # Restrict to the environment set for the trusted publisher
    environment:
      name: publish-package

    steps:
    - name: Download distribution artifact
      uses: actions/download-artifact@v8
      with:
        name: Packages
        path: dist

    - name: List all files
      run: ls -lh dist

    - name: Verify sdist artifact attestation
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPOSITORY: ${{ github.repository }}
      run: gh attestation verify dist/pyhf-*.tar.gz --repo "${REPOSITORY}"

    - name: Verify wheel artifact attestation
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPOSITORY: ${{ github.repository }}
      run: gh attestation verify dist/pyhf-*.whl --repo "${REPOSITORY}"

    - name: Publish distribution 📦 to Test PyPI
      uses: pypa/gh-action-pypi-publish@v1.14.2
      with:
        repository-url: https://test.pypi.org/legacy/
        print-hash: true

  publish-pypi:
    name: Publish Python distribution to PyPI
    needs: build
    if: needs.build.outputs.publish-target == 'pypi'
    runs-on: ubuntu-latest
    # Mandatory for publishing with a trusted publisher
    # c.f. https://docs.pypi.org/trusted-publishers/using-a-publisher/
    permissions:
      id-token: write
    # Restrict to the environment set for the trusted publisher
    environment:
      name: publish-package

    steps:
    - name: Download distribution artifact
      uses: actions/download-artifact@v8
      with:
        name: Packages
        path: dist

    - name: List all files
      run: ls -lh dist

    - name: Verify sdist artifact attestation
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPOSITORY: ${{ github.repository }}
      run: gh attestation verify dist/pyhf-*.tar.gz --repo "${REPOSITORY}"

    - name: Verify wheel artifact attestation
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPOSITORY: ${{ github.repository }}
      run: gh attestation verify dist/pyhf-*.whl --repo "${REPOSITORY}"

    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@v1.14.2
      with:
        print-hash: true
