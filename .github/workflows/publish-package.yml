name: publish distributions
on:
  push:
    branches:
    - main
    tags:
    - v*
  pull_request:
    branches:
    - main
    - release/v*
  release:
    types: [published]
  # Run weekly at 1:23 UTC
  schedule:
  - cron:  '23 1 * * 0'
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        description: 'Publish to TestPyPI'
        default: false

concurrency:
  # Include the event name so that the release event run of a tag can not
  # cancel the tag push event run mid-upload to TestPyPI (both runs share
  # the same refs/tags/vX.Y.Z ref)
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Python distribution
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    outputs:
      publish-target: ${{ steps.gate.outputs.target }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Determine publish target
      id: gate
      if: github.repository == 'scikit-hep/pyhf'
      env:
        PUBLISH_INPUT: ${{ inputs.publish }}
      run: |
        target=""
        # A GitHub release publication deploys to PyPI
        if [ "${GITHUB_EVENT_NAME}" == "release" ]; then
            target="pypi"
        # A pushed Git tag deploys to TestPyPI for verification in advance of the release
        elif [ "${GITHUB_EVENT_NAME}" == "push" ] && [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            target="testpypi"
        # A manual workflow dispatch deploys a dev release to TestPyPI
        elif [ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ] && [ "${PUBLISH_INPUT}" == "true" ]; then
            target="testpypi"
        fi
        echo "target=${target}" >> "$GITHUB_OUTPUT"

    - name: Build a sdist and wheel
      id: baipp
      uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1

    - name: Install uv
      if: github.event_name == 'schedule'
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: false

    # Scoped to a dedicated build so that warnings from other tools that
    # build-and-inspect-python-package runs don't error the check
    - name: Build a sdist and wheel and check for warnings
      if: github.event_name == 'schedule'
      env:
        PYTHONWARNINGS: 'error,default::DeprecationWarning'
      run: uvx --from 'build[uv]' pyproject-build --installer uv --outdir "${RUNNER_TEMP}/warnings-check-dist" .

    - name: Verify untagged commits have dev versions
      if: "!startsWith(github.ref, 'refs/tags/')"
      env:
        DIST_PATH: ${{ steps.baipp.outputs.dist }}
      run: |
        wheel_name=$(find "${DIST_PATH}" -iname "*.whl" -printf "%f\n")
        # A branch HEAD exactly at a release tag correctly builds a non-dev
        # version (e.g. a push to main of a tagged release commit, or a
        # dispatch on a release branch directly after its release)
        if release_tag="$(git describe --tags --exact-match 2> /dev/null)"; then
            echo "HEAD is at release tag ${release_tag}, so a non-dev version is expected"
        elif [[ "${wheel_name}" == *"pyhf-0.1.dev"* || "${wheel_name}" != *"dev"* ]]; then
            echo "python-build incorrectly named built distribution: ${wheel_name}"
            echo "python-build is lacking the history and tags required to determine version number"
            echo "intentionally erroring with 'exit 1' now"
            exit 1
        fi
        echo "python-build named built distribution: ${wheel_name}"

    - name: Verify tagged commits don't have dev versions
      if: startsWith(github.ref, 'refs/tags')
      env:
        DIST_PATH: ${{ steps.baipp.outputs.dist }}
      run: |
        wheel_name=$(find "${DIST_PATH}" -iname "*.whl" -printf "%f\n")
        if [[ "${wheel_name}" == *"dev"* ]]; then
          echo "python-build incorrectly named built distribution: ${wheel_name}"
          echo "this is incorrrectly being treated as a dev release"
          echo "intentionally erroring with 'exit 1' now"
          exit 1
        fi
        echo "python-build named built distribution: ${wheel_name}"

    - name: Generate artifact attestation for sdist and wheel
      if: steps.gate.outputs.target != ''
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: "${{ steps.baipp.outputs.dist }}/pyhf-*"

  publish:
    name: Publish Python distribution to (Test)PyPI
    needs: build
    if: needs.build.outputs.publish-target != ''
    runs-on: ubuntu-latest
    # Mandatory for publishing with a trusted publisher
    # c.f. https://docs.pypi.org/trusted-publishers/using-a-publisher/
    permissions:
      id-token: write
    # Restrict to the environment set for the trusted publisher
    environment:
      name: publish-package

    steps:
    - name: Download distribution artifact
      uses: actions/download-artifact@v8
      with:
        # artifact name from hynek/build-and-inspect-python-package
        name: Packages
        path: dist

    - name: List all files
      run: ls -lh dist

    - name: Verify sdist artifact attestation
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPOSITORY: ${{ github.repository }}
      run: gh attestation verify dist/pyhf-*.tar.gz --repo "${REPOSITORY}"

    - name: Verify wheel artifact attestation
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPOSITORY: ${{ github.repository }}
      run: gh attestation verify dist/pyhf-*.whl --repo "${REPOSITORY}"

    - name: Publish distribution to Test PyPI
      if: needs.build.outputs.publish-target == 'testpypi'
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        repository-url: https://test.pypi.org/legacy/
        print-hash: true

    - name: Publish distribution to PyPI
      if: needs.build.outputs.publish-target == 'pypi'
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        print-hash: true
