---
name: 🐛  Bug Report
description: Create a report to help us improve
labels: ["bug", "needs-triage"]

body:
- type: markdown
  attributes:
    value: >
      **Thank you for wanting to report a bug in pyhf!**


      ⚠
      Verify first that your issue is not [already reported on
      GitHub][issue search].


      [issue search]: https://github.com/scikit-hep/pyhf/issues?q=is%3Aopen+is%3Aissue+label%3Abug

- type: textarea
  attributes:
    label: Summary
    description: Explain the problem briefly below.
    placeholder: >-
      When I try to do X with pyhf and the following workspace, Y breaks or
      Z happens in an unexpected manner.
      Here are all the details I know about this problem.
  validations:
    required: true

- type: textarea
  attributes:
    label: OS / Environment
    description: >-
      Provide information on your operating system and Python environment.
      If you have pyhf installed, paste the output of `pyhf utils environment`.
      Otherwise, something like the output of `cat /etc/os-release` on Linux or
      `system_profiler -detailLevel mini SPSoftwareDataType` on macOS.
    render: console
    placeholder: |
      $ pyhf utils environment
      * os version: Ubuntu 22.04.4 LTS (Jammy Jellyfish)
      * kernel version: Linux 6.8.0-79-generic x86_64
      * python version: CPython 3.12.7 [GCC 13.2.0]
      * pyhf version: 0.7.6
      * numpy version: 2.1.3
      * scipy version: 1.14.1
      * iminuit version: 2.30.1
      * jax version: not installed
      * jaxlib version: not installed
  validations:
    required: true

- type: textarea
  attributes:
    label: Steps to Reproduce
    description: >-
      Describe exactly how to reproduce the problem, using a minimal test-case.
      It would *really* help us understand your problem if you paste in the Python code
      that you're running.


      **HINT:** You can paste [GitHub Gist](https://gist.github.com) links for larger files.
    value: |
      <!--- Paste your minimal failing Python example code between the quotes below -->
      ```python (paste below)

      ```

      <!--- ...or if you have a failing CLI command paste it between the quotes below -->
      ```console (paste below)

      ```
  validations:
    required: true

- type: textarea
  attributes:
    label: File Upload (optional)
    description: >-
      If your steps to reproduce your minimal failing example require either a spec or a
      workspace file, please upload it by attaching it to the text area here.


      **HINT:** You can paste [GitHub Gist](https://gist.github.com) links for larger files.
    placeholder: >-
      Attach any files or compressed archives by dragging & dropping, selecting,
      or pasting them here.
  validations:
    required: false

- type: textarea
  attributes:
    label: Expected Results
    description: >-
      Describe what you expected to happen when running the steps above.
    placeholder: >-
      I expected X to happen because I assumed Y.
  validations:
    required: true

- type: textarea
  attributes:
    label: Actual Results
    description: >-
      Paste verbatim program or command output.
      Don't wrap it with triple backticks &mdash; your whole input will be
      turned into a code snippet automatically.
    render: console
  validations:
    required: true

- type: textarea
  attributes:
    label: pyhf Version
    description: >-
      Paste verbatim output from `pyhf --version` below, under the prompt line.
      Don't wrap it with triple backticks &mdash; your whole input will be
      turned into a code snippet automatically.
    render: console
    placeholder: |
      $ pyhf --version
  validations:
    required: true

- type: checkboxes
  attributes:
    label: Code of Conduct
    description: |
      Read the [`pyhf` Code of Conduct][CoC] first.

      [CoC]: https://github.com/scikit-hep/pyhf/blob/main/CODE_OF_CONDUCT.md
    options:
    - label: I agree to follow the Code of Conduct
      required: true
...
